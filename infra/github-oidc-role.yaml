AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for lee-broker-tool deploys

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org/user (e.g. TaylorBarnes)
  GitHubRepo:
    Type: String
    Description: GitHub repo name (e.g. lee-broker-tool)
  GitHubBranch:
    Type: String
    Default: main

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub recommends this SHA-1 thumbprint for token.actions.githubusercontent.com
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lee-broker-tool-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only allow workflows from this repo/branch
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: lee-broker-tool-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ECR push/pull
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/lee-broker-tool

              # ECS deploy
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: "*"

              # Allow passing task execution/task roles already created by the stack
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/lee-broker-tool-ecs-ExecutionRole-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/lee-broker-tool-ecs-TaskRole-*

Outputs:
  RoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
