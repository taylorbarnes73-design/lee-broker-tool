# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # GitHub Actions is deprecating Node.js 20 for JS-based actions.
  # Opt into Node.js 24 now to avoid future breakage.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Enable Corepack (pnpm)
      run: corepack enable
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm check
    - name: Lint
      run: pnpm lint
    - name: Test
      run: pnpm test
    - name: Build
      run: pnpm build

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Enable Corepack (pnpm)
      run: corepack enable
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Chromium
      run: pnpm exec playwright install --with-deps chromium
    - name: Smoke tests
      run: pnpm smoketest
      env:
        JWT_SECRET: smoke-test-jwt-secret
        LOCAL_AUTH_ENABLED: "true"
        LOCAL_AUTH_EMAIL_DOMAIN: lee-associates.com
        VITE_ENABLE_AUTH_REDIRECT: "false"
        OAUTH_SERVER_URL: https://oauth.test.local
        DATABASE_URL: ""
